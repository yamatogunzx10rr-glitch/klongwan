<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klongwan Beach Resort</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Prompt', sans-serif;
  background: #f8f9fb;
  color: #222;
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  top: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  z-index: 1000;
}

/* HERO */
.hero {
  height: 90vh;
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
}

.hero h1 {
  font-size: 48px;
  font-weight: 600;
}

.hero p {
  font-size: 18px;
  margin-top: 10px;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 12px 25px;
  margin: 10px;
  background: linear-gradient(45deg, #f59e0b, #f97316);
  color: #fff;
  text-decoration: none;
  border-radius: 30px;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}

/* SECTION */
section {
  padding: 70px 20px;
  max-width: 1100px;
  margin: auto;
}

h2 {
  text-align: center;
  margin-bottom: 40px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
}

.card {
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05);
  text-align: center;
}

/* ROOMS */
.rooms {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
  gap: 25px;
}

.room-card {
  border-radius: 15px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.room-card:hover {
  transform: translateY(-8px);
}

.room-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  transition: 0.3s;
}

.room-card:hover img {
  transform: scale(1.1);
}

.room-content {
  padding: 15px;
}

.room-title {
  font-weight: 600;
  margin-bottom: 10px;
}

.icons {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  color: #555;
}

/* MAP */
iframe {
  border-radius: 15px;
}

/* FOOTER */
footer {
  background: #111;
  color: #aaa;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<nav>Klongwan Beach Resort</nav>

<div class="hero">
  <div>
    <h1>พักผ่อนติดทะเล</h1>
    <p>เงียบสงบ เป็นส่วนตัว เหมาะกับการพักผ่อน</p>
    <a href="tel:0864946393" class="btn">📞 จองเลย</a>
  </div>
</div>

<section>
  <h2>จุดเด่นของเรา</h2>
  <div class="grid">
    <div class="card">🌊 ติดทะเล</div>
    <div class="card">🏡 เงียบสงบ</div>
    <div class="card">📶 Wi-Fi ฟรี</div>
    <div class="card">🚗 ที่จอดรถ</div>
  </div>
</section>

<section>
  <h2>ห้องพัก</h2>
  <div class="rooms">

    <div class="room-card">
      <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a">
      <div class="room-content">
        <div class="room-title">Standard Room</div>
        <div class="icons">
          <span>📶</span><span>🚿</span><span>📺</span><span>❄️</span>
        </div>
      </div>
    </div>

    <div class="room-card">
      <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b">
      <div class="room-content">
        <div class="room-title">Deluxe Room</div>
        <div class="icons">
          <span>📶</span><span>🚿</span><span>📺</span><span>❄️</span>
        </div>
      </div>
    </div>

    <div class="room-card">
      <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427">
      <div class="room-content">
        <div class="room-title">Sea View</div>
        <div class="icons">
          <span>📶</span><span>🚿</span><span>📺</span><span>❄️</span>
        </div>
      </div>
    </div>

  </div>
</section>

<section>
  <h2>ติดต่อ</h2>
  <p style="text-align:center;">📞 086-494-6393</p>
  <div style="text-align:center;">
    <a class="btn" href="tel:0864946393">โทรเลย</a>
    <a class="btn" href="https://maps.app.goo.gl/DQNfhA9Wc6G7Uuvr8" target="_blank">นำทาง</a>
  </div>
</section>

<section>
  <h2>แผนที่</h2>
  <iframe src="https://www.google.com/maps?q=11.738248,99.779077&output=embed" width="100%" height="300"></iframe>
</section>

<footer>
  © 2026 Klongwan Beach Resort
</footer>

</body>
</html>
